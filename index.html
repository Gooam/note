<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>금선입 장부</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #0f172a;
      --gold-bg: #fefce8;
      --gold-border: #fde047;
      --gold-text: #854d0e;
      --cash-bg: #f0fdf4;
      --cash-border: #86efac;
      --cash-text: #166534;
      --border: #cbd5e1;
      --blue: #2563eb;
      --red: #dc2626;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; }
    body { margin: 0; padding: 8px; background: var(--bg); color: #1e293b; }
    .container { max-width: 500px; margin: 0 auto; padding-bottom: 40px; }

    /* 상단 날짜 선택 바 */
    .header-bar {
      background: var(--primary); color: #fff; padding: 10px 12px;
      border-radius: 12px; display: flex; justify-content: space-between;
      align-items: center; gap: 6px; margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .date-select-btn {
      flex: 1; padding: 8px 6px; font-size: 15px; font-weight: 800;
      border-radius: 8px; border: none; background: #fff; color: #0f172a; text-align: center; cursor: pointer;
    }
    .btn {
      padding: 8px 10px; border-radius: 8px; border: none;
      font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .btn-add { background: #3b82f6; color: #fff; }
    .btn-del { background: #ef4444; color: #fff; }

    /* 날짜 선택 목록 팝업 */
    .modal-bg {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center;
    }
    .modal-box {
      background: #fff; padding: 18px; border-radius: 14px; width: 90%; max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25); text-align: center;
    }
    .modal-box h3 { margin: 0 0 12px; font-size: 16px; color: #0f172a; }
    .modal-list { max-height: 260px; overflow-y: auto; margin-bottom: 14px; border: 1px solid #cbd5e1; border-radius: 8px; text-align: left; }
    .modal-item { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .modal-item:hover { background: #eff6ff; }
    .modal-item.active { background: #eff6ff; color: #2563eb; }

    /* 상단 요약 전광판 */
    .summary-card {
      background: var(--card); border-radius: 12px; padding: 10px;
      margin-bottom: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      border: 2px solid #94a3b8;
    }
    .summary-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px; font-size: 13px; font-weight: 800; color: #334155;
    }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border: 1px solid var(--border); padding: 5px 6px; text-align: center; vertical-align: middle; }
    .col-name { width: 34%; font-weight: 800; font-size: 13px; background: #f8fafc; color: #0f172a; }
    .col-val { width: 33%; }
    .col-memo { width: 33%; }

    .th-gold { background: var(--gold-bg); color: var(--gold-text); font-size: 13px; border-bottom: 2px solid var(--gold-border); padding: 6px 4px; }
    .th-cash { background: var(--cash-bg); color: var(--cash-text); font-size: 13px; border-bottom: 2px solid var(--cash-border); padding: 6px 4px; }

    .sum-val { font-size: 14px; font-weight: 800; background: #f8fafc; text-align: right; padding-right: 8px; }

    /* 입력칸 스타일 */
    .num-input {
      width: 100%; padding: 5px 6px; font-size: 14px; font-weight: 700;
      text-align: right; border: 1px solid #cbd5e1; border-radius: 5px;
      background: #fff; color: #0f172a; outline: none;
    }
    .num-input:focus { border: 2px solid #2563eb; background: #eff6ff; }

    /* 입력 리스트 카드 */
    .list-card {
      background: var(--card); border-radius: 12px; padding: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 12px;
    }
    .list-title {
      font-size: 13px; font-weight: 800; color: #475569;
      margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;
    }
    .btn-reset {
      background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px;
      padding: 3px 8px; font-size: 11px; font-weight: 700; color: #64748b; cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. 상단 날짜 선택 바 -->
  <div class="header-bar">
    <button class="date-select-btn" id="dateSelectBtn" onclick="openDateModal()">📅 날짜 선택</button>
    <button class="btn btn-add" onclick="addNewDate()">+ 새 날짜</button>
    <button class="btn btn-del" onclick="deleteCurrentDate()">삭제</button>
  </div>

  <!-- 2. 상단 요약 전광판 -->
  <div class="summary-card">
    <div class="summary-header">
      <span>📊 실시간 정산 요약</span>
      <button class="btn-reset" onclick="toggleCalcMode()" id="modeBtn" style="font-size:10px; padding:2px 6px;">차액: 보유 - 합계 🔄</button>
    </div>
    <table>
      <thead>
        <tr>
          <th class="col-name">구분</th>
          <th class="col-val th-gold">🟡 금선입 (돈)</th>
          <th class="col-memo th-cash">💵 현금선입</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="col-name" id="sumLabel1">합계</td>
          <td class="sum-val" id="sumGold">0</td>
          <td class="sum-val" id="sumCash">0</td>
        </tr>
        <tr>
          <td class="col-name" id="sumLabel2">보유</td>
          <td><input type="text" inputmode="decimal" class="num-input" id="holdGold" value="0" oninput="onHoldInput('gold', this)" style="text-align:right; font-size:14px; font-weight:800;"></td>
          <td><input type="text" inputmode="numeric" class="num-input" id="holdCash" value="0" oninput="onHoldInput('cash', this)" style="text-align:right; font-size:14px; font-weight:800;"></td>
        </tr>
        <tr>
          <td class="col-name" id="sumLabel3">차액</td>
          <td class="sum-val" id="diffGold" style="color:#2563eb;">0</td>
          <td class="sum-val" id="diffCash" style="color:#2563eb;">0</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 3. 업체별 입력 표 -->
  <div class="list-card">
    <div class="list-title">
      <span>📝 업체별 입력 <span style="color:#16a34a; font-weight:700;">(자동저장)</span></span>
      <button class="btn-reset" onclick="clearCurrentInputs()">현재칸 비우기</button>
    </div>
    <table>
      <thead>
        <tr>
          <th class="col-name">업체명</th>
          <th class="col-val th-gold">🟡 금선입 (돈)</th>
          <th class="col-memo th-cash">💵 현금선입</th>
        </tr>
      </thead>
      <tbody id="itemBody"></tbody>
    </table>
  </div>
</div>

<!-- 날짜 선택 목록 팝업 -->
<div class="modal-bg" id="dateModal">
  <div class="modal-box">
    <h3>📅 저장된 날짜 선택</h3>
    <div class="modal-list" id="modalDateList"></div>
    <button class="btn" style="background:#cbd5e1; color:#334155; width:100%; padding:10px;" onclick="closeDateModal()">닫기</button>
  </div>
</div>

<script>
  const STORAGE_KEY = "my_gold_note_ledger";

  const DEFAULT_COMPANIES = [
    "샤크존예작", "순천용당", "유성예작", "유성티파니", 
    "제이앤", "마산창원", "청수상당", "수정금방", "홍주얼리"
  ];

  let appData = {
    currentDate: "",
    records: {}
  };

  let isHoldMinusSum = true;

  function getTodayStr() {
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function createEmptyRecord() {
    const rec = { holdGold: "", holdCash: "", companies: {} };
    DEFAULT_COMPANIES.forEach(name => {
      rec.companies[name] = { gold: "", cash: "" };
    });
    return rec;
  }

  function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try { appData = JSON.parse(saved); } catch (e) {}
    }
    const today = getTodayStr();
    if (!appData.records) appData.records = {};

    Object.keys(appData.records).forEach(d => {
      const rec = appData.records[d];
      if (rec && rec.companies) {
        DEFAULT_COMPANIES.forEach(name => {
          if (!rec.companies[name]) rec.companies[name] = { gold: "", cash: "" };
        });
      }
    });

    const dates = Object.keys(appData.records).sort().reverse();
    if (dates.length === 0) {
      appData.records[today] = createEmptyRecord();
      appData.currentDate = today;
    } else {
      if (!appData.currentDate || !appData.records[appData.currentDate]) {
        appData.currentDate = dates[0];
      }
    }
    saveData();
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  }

  function parseNum(val) {
    if (!val) return 0;
    const cleaned = String(val).replace(/,/g, '').trim();
    const num = parseFloat(cleaned);
    return isNaN(num) ? 0 : num;
  }

  function formatCash(num) {
    return Math.round(num).toLocaleString('ko-KR');
  }

  function formatGold(num) {
    return Number(num).toFixed(2);
  }

  function formatInputVal(str, isDecimal = false) {
    if (!str && str !== 0) return "";
    const s = String(str);
    const isMinus = s.trim().startsWith("-");
    const raw = isDecimal ? s.replace(/[^0-9.]/g, "") : s.replace(/[^0-9]/g, "");
    if (!raw) return isMinus ? "-" : "";
    return (isMinus ? "-" : "") + raw;
  }

  function renderTable() {
    document.getElementById("dateSelectBtn").textContent = `📅 ${appData.currentDate || "날짜 없음"}`;

    const rec = appData.records[appData.currentDate] || createEmptyRecord();
    if (!appData.records[appData.currentDate]) {
      appData.records[appData.currentDate] = rec;
    }

    document.getElementById("holdGold").value = formatInputVal(rec.holdGold, true);
    document.getElementById("holdCash").value = formatInputVal(rec.holdCash, false);

    const tbody = document.getElementById("itemBody");
    tbody.innerHTML = "";

    const companyNames = Object.keys(rec.companies || {});
    companyNames.forEach(name => {
      const item = rec.companies[name] || { gold: "", cash: "" };
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="col-name"><span style="font-size:13px; font-weight:800; color:#0f172a;">${name}</span></td>
        <td>
          <input type="text" inputmode="decimal" class="num-input"
            value="${formatInputVal(item.gold, true)}" placeholder="0"
            oninput="onItemInput('${name}', 'gold', this)">
        </td>
        <td>
          <input type="text" inputmode="numeric" class="num-input"
            value="${formatInputVal(item.cash, false)}" placeholder="0"
            oninput="onItemInput('${name}', 'cash', this)">
        </td>
      `;
      tbody.appendChild(tr);
    });

    calculateTotals();
  }

  function onItemInput(companyName, type, el) {
    const rec = appData.records[appData.currentDate];
    if (!rec || !rec.companies[companyName]) return;
    rec.companies[companyName][type] = el.value;
    saveData();
    calculateTotals();
  }

  function onHoldInput(type, el) {
    const rec = appData.records[appData.currentDate];
    if (!rec) return;
    if (type === 'gold') rec.holdGold = el.value;
    if (type === 'cash') rec.holdCash = el.value;
    saveData();
    calculateTotals();
  }

  function calculateTotals() {
    let totalGold = 0;
    let totalCash = 0;

    const rec = appData.records[appData.currentDate];
    if (rec && rec.companies) {
      Object.keys(rec.companies).forEach(name => {
        totalGold += parseNum(rec.companies[name].gold);
        totalCash += parseNum(rec.companies[name].cash);
      });
    }

    document.getElementById("sumGold").textContent = formatGold(totalGold) + "돈";
    document.getElementById("sumCash").textContent = formatCash(totalCash);

    const holdG = parseNum(rec.holdGold);
    const holdC = parseNum(rec.holdCash);

    let diffG = isHoldMinusSum ? (holdG - totalGold) : (totalGold - holdG);
    let diffC = isHoldMinusSum ? (holdC - totalCash) : (totalCash - holdC);

    const diffGoldEl = document.getElementById("diffGold");
    const diffCashEl = document.getElementById("diffCash");

    diffGoldEl.textContent = formatGold(diffG) + "돈";
    diffCashEl.textContent = formatCash(diffC);

    diffGoldEl.style.color = diffG < 0 ? "#dc2626" : "#2563eb";
    diffCashEl.style.color = diffC < 0 ? "#dc2626" : "#2563eb";
  }

  function toggleCalcMode() {
    isHoldMinusSum = !isHoldMinusSum;
    const btn = document.getElementById("modeBtn");
    const l1 = document.getElementById("sumLabel1");
    const l2 = document.getElementById("sumLabel2");
    const l3 = document.getElementById("sumLabel3");

    if (isHoldMinusSum) {
      btn.textContent = "차액: 보유 - 합계 🔄";
      l1.textContent = "합계";
      l2.textContent = "보유";
      l3.textContent = "차액";
    } else {
      btn.textContent = "차액: 합계 - 보유 🔄";
      l1.textContent = "보유";
      l2.textContent = "합계";
      l3.textContent = "차액";
    }
    calculateTotals();
  }

  function openDateModal() {
    const listEl = document.getElementById("modalDateList");
    listEl.innerHTML = "";
    const dates = Object.keys(appData.records).sort().reverse();

    dates.forEach(d => {
      const div = document.createElement("div");
      div.className = `modal-item ${d === appData.currentDate ? 'active' : ''}`;
      div.innerHTML = `📅 ${d}`;
      div.onclick = () => {
        appData.currentDate = d;
        saveData();
        renderTable();
        closeDateModal();
      };
      listEl.appendChild(div);
    });

    document.getElementById("dateModal").style.display = "flex";
  }

  function closeDateModal() {
    document.getElementById("dateModal").style.display = "none";
  }

  function addNewDate() {
    const newD = prompt("추가할 날짜를 입력하세요 (예: 2026-11-18)", getTodayStr());
    if (!newD) return;
    if (!appData.records[newD]) {
      appData.records[newD] = createEmptyRecord();
    }
    appData.currentDate = newD;
    saveData();
    renderTable();
  }

  function clearCurrentInputs() {
    if (!appData.currentDate) return;
    if (!confirm(`[${appDate.currentDate}] 날짜의 입력된 내용을 모두 비우시겠습니까?`)) return;
    appData.records[appData.currentDate] = createEmptyRecord();
    saveData();
    renderTable();
  }

  function deleteCurrentDate() {
    if (!appData.currentDate) return;
    const dates = Object.keys(appData.records);
    if (dates.length <= 1) {
      alert("마지막 남은 날짜는 삭제할 수 없습니다.");
      return;
    }
    if (!confirm(`[${appDate.currentDate}] 날짜 기록을 삭제하시겠습니까?`)) return;
    delete appData.records[appData.currentDate];
    const remainDates = Object.keys(appData.records).sort().reverse();
    appData.currentDate = remainDates[0];
    saveData();
    renderTable();
  }

  loadData();
  renderTable();
</script>
</body>
</html>
